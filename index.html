<html lang="pt">
<head>

<meta name="theme-color" content="#78BE20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>PalKo</title>
<script>
/* link do PalKo no Apps Script (Implementar › Gerir implementações › URL da app web, termina em /exec) */
window.PALKO_URL_FIXO = '';
(function(){
  try{ const q = new URLSearchParams(location.search).get('u'); if (q) localStorage.setItem('palko.url', q); }catch(e){}
  let u = window.PALKO_URL_FIXO; try{ u = u || localStorage.getItem('palko.url') || ''; }catch(e){}
  window.PALKO_URL = /^https:\/\/script\.google\.com\/.+\/exec$/.test(u) ? u : '';
})();
</script>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#78BE20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --bar:#78BE20; --bar-ink:#102405;
  --ground:#F1F4EE; --surface:#FFFFFF; --surface-2:#F6F8F3; --ink:#1E2819; --muted:#5B6855; --line:#D3DBCC;
  --accent:#188803; --accent-ink:#FFFFFF; --accent-soft:#EBF5DE;
  --ok:#0B7A6B; --ok-soft:#DDF2EE; --bad:#C0282D; --bad-soft:#FBE5E4; --warn:#9A5C00; --warn-soft:#FBF0DC;
  --focus:#E0620D;
  --sans:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bar:#78BE20; --bar-ink:#102405;
    --ground:#0F130D; --surface:#171D14; --surface-2:#1C2419; --ink:#E6ECE2; --muted:#98A590; --line:#2C3727;
    --accent:#8ED14B; --accent-ink:#0E1A06; --accent-soft:#1D2D11;
    --ok:#3CC7B0; --ok-soft:#12302B; --bad:#FF7A72; --bad-soft:#3A1B1A; --warn:#F2B650; --warn-soft:#352812;
    --focus:#FF9147;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bar:#78BE20; --bar-ink:#102405;
    --ground:#0F130D; --surface:#171D14; --surface-2:#1C2419; --ink:#E6ECE2; --muted:#98A590; --line:#2C3727;
    --accent:#8ED14B; --accent-ink:#0E1A06; --accent-soft:#1D2D11;
    --ok:#3CC7B0; --ok-soft:#12302B; --bad:#FF7A72; --bad-soft:#3A1B1A; --warn:#F2B650; --warn-soft:#352812;
    --focus:#FF9147;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent)}
.logo{height:30px;width:auto;display:block;flex:none}
.logo{margin-right:2px}
.palko{height:28px;width:auto;display:block;flex:none}
@media (max-width:520px){.logo{display:none}}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;overflow:hidden;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{flex:none}
.brand small{font-weight:500;opacity:.8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:0;color:inherit;padding:8px 10px;border-radius:6px;font-weight:600;font-size:15px;opacity:.75}
.tab[aria-current="true"]{opacity:1;background:color-mix(in srgb,var(--bar-ink) 14%,transparent)}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:20px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.section{margin-top:20px;display:flex;flex-direction:column;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
input[type=text],input[type=search],textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
textarea{min-height:72px;resize:vertical}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* chips e pills */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.todo{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.doing{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.fat{background:var(--accent);color:var(--accent-ink)}
.pill.nok{background:var(--bad);color:var(--surface)}
.pill.off{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.qty .all{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.carrier{font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* lista de encomendas */
.orders{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.order{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.order:last-child{border-bottom:0}
.order:hover{background:var(--surface-2)}
.order .num{font-family:var(--mono);font-weight:600;font-size:19px}
.order .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.order .cli{font-weight:600;color:var(--ink)}

/* conferência */
.otop{padding-top:12px}
.ohead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--ground);padding-block:10px;display:flex;flex-direction:column;gap:8px}
.ohead .num{font-family:var(--mono);font-weight:600;font-size:24px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.scanbox{display:flex;gap:8px}
.scanbox input{font-family:var(--mono);font-size:18px;border:2px solid var(--accent);background:var(--surface)}
.feedback{border-radius:10px;padding:8px 12px;font-weight:600;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.feedback.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.feedback.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.feedback.idle{background:var(--surface);color:var(--muted);border-color:var(--line);font-weight:500}
.feedback .fb-title{font-size:16px}
.feedback .fb-sub{font-weight:500;color:var(--ink);font-size:14px}
.flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(1.015)}100%{transform:none}}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:10px 12px}
.item.st-part{border-left-color:var(--warn)}
.item.st-done{border-left-color:var(--ok);background:var(--ok-soft)}
.item.st-over{border-left-color:var(--bad);background:var(--bad-soft)}
.item.st-off{opacity:.65;border-left-style:dashed}
.item.hit{box-shadow:0 0 0 3px var(--focus)}
.item .desc{font-weight:600;font-size:15px;line-height:1.25}
.item .codes{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.item .codes b{font-weight:600;color:var(--ink)}
.qty{display:flex;align-items:center;gap:6px}
.qty .count{font-family:var(--mono);font-weight:600;font-size:20px;min-width:64px;text-align:center}
.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.extras .item{border-left-color:var(--bad)}
.summary-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.summary-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:6px;background:var(--surface-2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom-in{max-width:728px;margin:0 auto;display:flex;gap:8px}

.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:10%;right:10%;top:42%;height:16%;border:3px solid var(--focus);border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.hero-empty{display:grid;gap:14px}
.steps{margin:0;padding-left:22px;display:grid;gap:6px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
details.panel summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";font-size:22px;color:var(--muted)}
details.panel[open] summary::after{content:"–"}
.check{display:flex;gap:10px;align-items:center;min-height:40px}
.check input{width:22px;height:22px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.brand small,.brand span{display:none}.item{grid-template-columns:1fr}.qty{justify-content:flex-end}}

/* ---- extra: ecrãs de entrada, tabelas do backoffice ---- */
.login{max-width:420px;margin:48px auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.big-in{font-size:20px!important;min-height:56px!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.detail td{background:var(--surface-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.file-state{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--ok)}
.wrap.wide{max-width:1100px}
.top-in.wide{max-width:1100px}
.sync{font-size:12px;opacity:.85;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.tbl input[type=checkbox]{width:20px;height:20px}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px}
a.btn.primary{color:var(--accent-ink)}
.tbl td:last-child{white-space:nowrap}
input[type=date],input[type=password]{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
input[type=password]{width:100%}
</style>

<style>
/* ---- PDA: ecrã de conferência compacto ---- */
.top-in{padding:6px 12px}
.brand{font-size:15px}
.ohead.compact{padding-block:6px 6px;gap:6px}
.orow{display:flex;align-items:center;gap:8px;min-width:0}
.orow .back{min-height:34px;padding:0 10px;font-size:18px}
.orow .num{font-family:var(--mono);font-weight:600;font-size:18px;white-space:nowrap}
.orow .cli{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .prog{white-space:nowrap}
.ohead .bar{height:6px}
.scanbox input{min-height:40px!important;font-size:16px;padding:6px 10px}
.scanbox .btn{min-height:40px}
.btn.cam{flex:none;min-width:48px;font-size:20px;padding:0 10px}
#camLayer{position:fixed;inset:0;z-index:90;background:#0b1208;display:flex;flex-direction:column;color:#fff}

#camLayer .cam-fb .t{font-weight:800;font-size:16px}#camLayer .cam-fb .s{font-size:13px;color:var(--muted);margin-top:2px}
#camLayer .cam-msg{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.7);border-radius:10px;padding:10px 12px;font-size:14px}
.ohead .feedback{padding:5px 10px;border-radius:8px}
.ohead .feedback .fb-title{font-size:14px}
.ohead .feedback .fb-sub{font-size:12px}
.olist{gap:8px;padding-top:4px}
.olist .feedback{padding:6px 10px}
.strip{font-size:13px;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.strip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.items{gap:4px}
.item,.item:is(*){grid-template-columns:minmax(0,1fr) auto!important;gap:2px 8px;padding:5px 8px;border-left-width:4px;border-radius:6px}
.item .desc{font-size:13.5px;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .codes{font-size:11.5px;gap:8px;align-items:center}
.qty{gap:4px;justify-content:flex-end}
.qty button{width:32px;height:32px;font-size:17px;border-radius:6px}
.qty .count{font-size:15px;min-width:44px}
.codes .all{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:700;height:22px}
.olist .label{font-size:11px}
.bottom{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom .btn{min-height:42px}
.fin .check{min-height:34px}
.wrap{padding-bottom:70px}
/* ---- v2: mais simples de usar ---- */
.hello{padding:4px 2px}
.hello .big{font-size:22px;font-weight:600;line-height:1.2}
.hello .big b{font-family:var(--mono);font-size:30px;color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px}
.seg-b{border:0;background:transparent;border-radius:9px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.seg-b b{font-family:var(--mono);font-size:20px;color:var(--ink)}
.seg-b span{font-size:12px;font-weight:600}
.seg-b[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}
.seg-b[aria-pressed="true"] b{color:var(--accent)}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.modo button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:800;font-size:16px;color:var(--muted)}
.modo button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modo button small{font-family:var(--mono);font-weight:700;margin-left:4px}
.pca-num{font-family:var(--mono);font-size:26px;font-weight:800}
.chip.big{min-height:48px;font-size:16px;font-weight:700}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fbar select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-weight:600;font-size:14px;width:100%;min-width:0}
.fbar select.on{border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.searchbox{position:relative}
.searchbox span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.searchbox input{padding-left:38px!important;min-height:44px!important;background:var(--surface)!important}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}

.card.st-doing::before{background:var(--warn)}
.card.st-ok::before,.card.st-fat::before{background:var(--ok)}
.card.st-bad::before,.card.st-nok::before{background:var(--bad)}
.card.st-off{opacity:.6}
.card:active{transform:scale(.99)}
.card .c1,.card .c2,.card .c3{display:flex;align-items:center;justify-content:space-between;gap:8px}

.card .cli{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .qt{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
.card .c4{font-size:13px;color:var(--muted)}
.empty-ico{font-size:34px;color:var(--ok);margin-bottom:6px}
.recentes{display:flex;flex-direction:column;gap:6px}

.recente.on{border:2px solid var(--accent);background:var(--accent-soft)}
.recente .av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.recente small{display:block;color:var(--muted);font-size:12px}
.papel span i{font-style:normal;font-size:22px;margin-right:8px;color:var(--accent)}

.ohead .feedback.bad{background:var(--bad)}

.ohead .feedback.ok .fb-title::before{content:"✓"}
.ohead .feedback.bad .fb-title::before{content:"✕"}

<script>
/* Funções partilhadas entre Backoffice e FrontOffice */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=c=>String(c??'').replace(/\D/g,'').replace(/^0+/,'');
const fold=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();
const pedKey=s=>fold(s).replace(/\s+/g,'');
const fmtN=n=>{n=+n;if(!isFinite(n))return'';return Number.isInteger(n)?String(n):String(+n.toFixed(2)).replace('.',',');};
const now=()=>new Date().toISOString();
const fmtDT=iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return String(iso);return d.toLocaleDateString('pt-PT')+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});};
const fmtT=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});};
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

/* chamada ao servidor Apps Script como Promise */
function api(fn,...args){
  return new Promise((res,rej)=>{
    if(!(window.google&&google.script&&google.script.run)){
      // PalKo Móvel (fora do Google): chama o servidor pelo link /exec
      if(window.PALKO_URL){fetch(window.PALKO_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
        .then(r=>r.json()).then(d=>d&&d.ok?res(d.r):rej(new Error(d&&d.erro||'Erro no servidor.'))).catch(()=>rej(new Error('Sem ligação ao servidor.')));return;}
      rej(new Error('Sem ligação ao servidor.'));return;}
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error(String(e&&e.message||e))))[fn](...args);
  });
}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let toastT;function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
let AC=null;
function beep(kind,on=true){
  if(!on)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq=kind==='ok'?[[1320,.09]]:kind==='warn'?[[660,.12],[660,.12]]:[[220,.18],[180,.28]];
    let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='ok'?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d+.05;}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(kind==='ok'?60:[120,60,160]);}catch(e){}
}

/* regras de negócio partilhadas */
const VAL_TXT={OK:'Segue completo',PARCIAL:'Segue parcial',NOK:'NOK — não segue'};
const VAL_CLS={OK:'ok',PARCIAL:'warn',NOK:'bad'};
const SEP_TXT={DISPONIVEL:'Disponível',PARCIAL:'Parcialmente disponível',RETIRADO:'Retirado'};
let ESTADOS=['Disponível','Parcial'];
/* uma linha entra na separação/conferência se o sistema a dá como disponível, ou se o separador a localizou na prateleira */
const incluidoEstado=it=>ESTADOS.some(e=>fold(e)===fold(it.estado));
const incluido=it=>incluidoEstado(it)||(+it.localizado>0);
const alvoSistema=it=>(it.qr!=null&&it.qr>0)?it.qr:(it.qt||0);
const alvo=it=>(!incluidoEstado(it)&&+it.localizado>0)?+it.localizado:alvoSistema(it);
const localizavel=it=>!incluidoEstado(it)&&!/RETIRAD|CANCEL|ANULAD/.test(fold(it.estado));
function motivoSemConferencia(o){
  if(o.validacao==='NOK')return'NOK — não segue';
  if(o.separacao==='RETIRADO')return'Retirado';
  if(!o.items.some(incluido))return'Sem artigos disponíveis';
  return null;
}
const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
function fmtDia(d){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return d?String(d):'Sem data';const dt=new Date(+m[1],+m[2]-1,+m[3]);
  const h=new Date();h.setHours(0,0,0,0);const dif=Math.round((dt-h)/864e5);
  return (dif===0?'Hoje':dif===1?'Amanhã':DIAS_SEM[dt.getDay()])+' '+m[3]+'/'+m[2];}
/* chips de datas de entrega: [[data, n], ...] ordenadas */
function datasDe(lista){const c={};lista.forEach(o=>{const d=o.data||'';c[d]=(c[d]||0)+1;});return Object.keys(c).sort().map(d=>[d,c[d]]);}
const ordenarPorData=l=>[...l].sort((a,b)=>String(a.data||'9999').localeCompare(String(b.data||'9999'))||String(a.pedido).localeCompare(String(b.pedido),'pt',{numeric:true}));
function transportadorasDe(lista){const c={};lista.forEach(o=>{const t=o.transportadora||'—';c[t]=(c[t]||0)+1;});return Object.keys(c).sort((a,b)=>a.localeCompare(b,'pt')).map(t=>[t,c[t]]);}
const unidades=o=>o.items.filter(incluido).reduce((s,it)=>s+alvo(it),0);

<script>

if(S.modoSep!=='pca')S.modoSep='ped';

/* identificação: nome + LDAP; pede de novo cada dia (o PDA pode passar de mão em mão) */
const IDENT_HORAS=10;
function identValida(){return S.nome&&S.ldap&&S.entrada&&(Date.now()-new Date(S.entrada).getTime())<IDENT_HORAS*3600e3;}

let DATA={encomendas:[],fonte:null};
let filtroData='todas',filtroT='todas',filtroL='todas',SEPF=null;
let INCID={separacao:['Material Danificado','Tombo Palete','Sem Embalamento','Palete em Falta','Morada de Loja','Morada de Trânsito'],conferencia:['Artigo em Falta','Artigo em Excesso','Artigo Trocado','Artigo Danificado']};

let view='list',cur=null,filtro='todo',pesquisa='',lastFb=null,lastHit=null,finishing=false,conflito=null,online=true,lastSync=null,ASSOC=null;
let ERRO_LISTA='';
function vErroLista(){return ERRO_LISTA?`<div class="feedback bad"><div class="stack" style="gap:6px"><div class="fb-title">Não foi possível carregar os pedidos</div><div class="fb-sub">${esc(ERRO_LISTA)}</div><div class="fb-sub">Mostre esta mensagem ao Backoffice. <button class="btn sm" id="tentarBtn">Tentar de novo</button></div></div></div>`:'';}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* sessão no PDA: entrada, saída, pausas e um sinal de vida a cada 10 min (para o tempo ativo dos KPI) */
function sessao(ev,motivo){if(!S.ldap)return;S.pendSes.push({id:uid(),t:now(),ev,motivo:motivo||'',ldap:S.ldap,nome:S.nome,papel:S.papel});S.ultAtivo=Date.now();save();}
function pausar(motivo){if(S.pausa)return;S.pausa={desde:now(),motivo};sessao('pausa',motivo);toast('Pausa iniciada. Bom descanso!');render();enviarPendentes().then(()=>refresh(true));}
function retomar(silencioso){if(!S.pausa)return;S.pausa=null;sessao('retoma');if(!silencioso)toast('Pausa terminada. Bom trabalho!');render();enviarPendentes().then(()=>refresh(true));}

/* ---------- servidor ---------- */
async function refresh(silencioso){
  try{
    if(S.operador&&Date.now()-(S.ultAtivo||0)>10*60e3)sessao('ativo');
    const d=await api('foListar',S.operador?{ldap:S.ldap,nome:S.nome,papel:S.papel}:null);DATA=d;ERRO_LISTA='';if(d.estadosAConferir)ESTADOS=d.estadosAConferir;if(d.incidencias)INCID=d.incidencias;if(d.prioridades)PRIOS=d.prioridades;online=true;lastSync=new Date();
    await enviarPendentes();
    reconciliar();avisarFaturados();
  }catch(e){online=false;ERRO_LISTA=String(e&&e.message||e);if(!silencioso)toast('Sem ligação ao servidor. Pode continuar a conferir; os dados são enviados depois.');}
  lsSet(KEY+'.cache',DATA);
  syncLabel();
  if(view==='pca'&&S.pcaAtivas[curPCA]&&pcaDe(curPCA))return;   // a preencher o PCA: não apagar o que está a escrever
  if(view!=='order'||!orderByPed(cur))render();
}
/* Compara as conferências abertas neste PDA com o estado no servidor.
   Se o escritório libertou o pedido (ou outro conferente o fechou), as leituras locais deixam de valer. */
function reconciliar(){
  let mudou=false;
  for(const ped of Object.keys(S.progress)){
    const o=orderByPed(ped),p=S.progress[ped];if(!o)continue;
    if(o.estado==='Em curso'&&o.conferente===S.operador){p.lock=true;continue;}
    if(!p.lock){ // começou sem ligação: tenta reservar o pedido agora
      api('foIniciar',ped,S.operador,false).then(r=>{if(r&&r.ok&&S.progress[ped]){S.progress[ped].lock=true;save();}}).catch(()=>{});continue;}
    let motivo;
    if(o.faturado)motivo='já foi faturado pelo escritório';
    else if(o.estado==='Em curso')motivo=`está agora a ser conferido por ${o.conferente||'outro conferente'}`;
    else if(o.estado==='Conferida'||o.estado==='Pendente')motivo=`já foi fechado por ${o.conferente||'outro conferente'}`;
    else motivo='foi libertado pelo escritório';
    delete S.progress[ped];S.avisos.push({ped,motivo,t:now()});mudou=true;
    if(view==='order'&&cur===ped){view='list';cur=null;finishing=false;conflito=null;lastFb=null;}
  }
  for(const k of Object.keys(S.pcaAtivas)){
    const p=pcaDe(k);if(!p||S.pcaAtivas[k].offline)continue;
    if(p.estado==='Em separação'&&p.separador===S.operador)continue;
    const motivo=p.estado==='Separado'?`já foi separado por ${p.separador||'outro separador'}`:p.estado==='Em separação'?`está agora com ${p.separador||'outro separador'}`:'foi libertado pelo escritório';
    delete S.pcaAtivas[k];S.avisos.push({ped:'PCA '+k,motivo,t:now()});mudou=true;if(view==='pca'&&curPCA===k){view='list';curPCA=null;PCAF=null;}
  }
  for(const ped of Object.keys(S.sepAtivas)){
    const o=orderByPed(ped);if(!o)continue;
    if(o.sepEstado==='Em separação'&&o.separador===S.operador)continue;
    if(o.sepEstado==='Separado'&&o.separador===S.operador&&S.pendSep.some(r=>r.pedido===ped))continue;
    const motivo=o.sepEstado==='Em separação'?`está agora a ser separado por ${o.separador||'outro operador'}`:o.sepEstado==='Separado'?`já foi separado por ${o.separador||'outro operador'}`:'foi libertado pelo escritório';
    delete S.sepAtivas[ped];S.avisos.push({ped,motivo,t:now(),sep:true});mudou=true;
    if(view==='order'&&cur===ped){view='list';cur=null;finishing=false;conflito=null;SEPF=null;}
  }
  if(mudou){save();beep('warn',S.som);render();}
}
async function enviarPendentes(){
  if(S.pendSes.length){const lote=S.pendSes.slice(0,50),ids=new Set(lote.map(x=>x.id));try{await api('foSessao',lote);S.pendSes=S.pendSes.filter(x=>!ids.has(x.id));save();}catch(e){online=false;}}
  if(S.pendAssoc.length){const lote=[...S.pendAssoc],ids=new Set(lote.map(x=>x.id));try{await api('foAssociarEan',lote);S.pendAssoc=S.pendAssoc.filter(x=>!ids.has(x.id));save();}catch(e){online=false;}}
  for(const rec of [...S.pendSep]){try{await api('foSeparar',rec);S.pendSep=S.pendSep.filter(r=>r.id!==rec.id);save();}catch(e){online=false;break;}}
  for(const rec of [...S.pendPCA]){try{await api('foSepararPCA',rec);S.pendPCA=S.pendPCA.filter(r=>r.id!==rec.id);save();}catch(e){online=false;break;}}
  const fila=[...S.pendentes];
  for(const rec of fila){try{await api('foFechar',rec);S.pendentes=S.pendentes.filter(r=>r.id!==rec.id);save();}catch(e){online=false;break;}}
}
function syncLabel(){
  const p=S.pendentes.length+S.pendSep.length+S.pendPCA.length;
  $('#sync').textContent=(online?'':'Sem ligação · ')+(p?`${p} por enviar · `:'')+(lastSync?'atualizado '+lastSync.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'');
}

/* ---------- lógica ---------- */
const orderByPed=p=>DATA.encomendas.find(o=>o.pedido===p);
const prog=p=>S.progress[p];
/* as contagens são guardadas por artigo (LM), não pela posição na lista:
   assim uma listagem atualizada a meio da conferência não baralha o que já foi lido */
function ik(o,i){const lm=o.items[i].lm;let n=0;for(let j=0;j<i;j++)if(o.items[j].lm===lm)n++;return lm+'#'+n;}
const cnt=(o,i)=>{const p=prog(o.pedido);return p?(p.counts[ik(o,i)]||0):0;};
function totals(o){let need=0,got=0,falta=0,exc=0;o.items.forEach((it,i)=>{if(!incluido(it))return;const a=alvo(it),c=cnt(o,i);need+=a;got+=Math.min(c,a);if(c<a)falta+=a-c;if(c>a)exc+=c-a;});const ext=(prog(o.pedido)?.extras||[]).reduce((s,e)=>s+e.n,0);return{need,got,falta,exc,ext};}
function orderStatus(o){
  if(o.faturado)return{k:'fat',t:'Faturado'};
  if(prog(o.pedido))return{k:'doing',t:prog(o.pedido).reconf?'Reconferência (você)':'Em curso (você)'};
  const m=motivoSemConferencia(o);
  if(o.estado==='Por reconferir'&&!m)return{k:'alt',t:recont(o)?'Recontar diferenças':'Alterada · reconferir'};
  if(!m&&o.sepEstado!=='Separado'&&!o.estado.match(/Conferida|Pendente/))return{k:'off',t:o.sepEstado==='Em separação'?'Em separação':'Aguarda separação'};if(m)return{k:m.startsWith('NOK')?'nok':'off',t:m};
  if(o.estado==='Em curso')return{k:'doing',t:'Em curso · '+(o.conferente||'?')};
  if(o.estado==='Conferida')return{k:'ok',t:'Conferida'};
  if(o.estado==='Pendente')return{k:'bad',t:'Pendente'};
  return{k:'todo',t:'Por conferir'};
}
const codigosDe=it=>[it.ean,it.lm,...(it.alt||[])].map(norm).filter(Boolean);
function matchIdx(o,code){
  const n=norm(code);if(!n)return{idx:-1};
  const pa=prog(o.pedido);if(pa&&pa.assoc&&pa.assoc[n]){const i=o.items.findIndex((_,j)=>ik(o,j)===pa.assoc[n]);if(i>=0)return{idx:i};}
  if(S.eanLocal[n]){const lm=norm(S.eanLocal[n]);let f=-1;o.items.forEach((it,i)=>{if(norm(it.lm)===lm&&incluido(it)&&(f<0||cnt(o,f)>=alvo(o.items[f])))f=i;});if(f>=0)return{idx:f};}
  let first=-1,firstOff=-1;
  o.items.forEach((it,i)=>{if(!codigosDe(it).includes(n))return;
    if(incluido(it)){if(first<0||(cnt(o,first)>=alvo(o.items[first])&&cnt(o,i)<alvo(it)))first=i;}else if(firstOff<0)firstOff=i;});
  if(first>=0)return{idx:first};if(firstOff>=0)return{idx:firstOff,off:true};return{idx:-1};
}
function otherOrderWith(code,except){const n=norm(code);for(const o of DATA.encomendas){if(o.pedido===except)continue;if(o.items.some(it=>codigosDe(it).includes(n)))return o.pedido;}return null;}
function startLocal(ped,inicio){if(!S.progress[ped]){S.progress[ped]={counts:{},extras:[],log:[],manual:{},inicio:inicio||now()};const o=orderByPed(ped);if(o&&o.alteracao)prepararReconf(o,S.progress[ped]);}save();}
/* reconferência: as linhas que não mudaram ficam como já conferidas (foram conferidas antes) */
const chavesAlt=o=>new Set(((o.alteracao&&o.alteracao.linhas)||[]).map(l=>l.k));
const eraDe=(o,K)=>((o.alteracao&&o.alteracao.linhas)||[]).find(l=>l.k===K);
function prepararReconf(o,p){const keys=chavesAlt(o);p.herdada={};o.items.forEach((it,i)=>{if(!incluido(it))return;const K=ik(o,i);if(!keys.has(K)){p.counts[K]=alvo(it);p.herdada[K]=true;}});p.reconf=true;}
function totaisDe(o,idx){let need=0,got=0;idx.forEach(i=>{const a=alvo(o.items[i]),c=cnt(o,i);need+=a;got+=Math.min(c,a);});return{need,got};}

/* ================= LEITURA PELA CÂMARA (telemóveis) =================
   Android/Chrome: leitor de códigos do próprio telemóvel (BarcodeDetector). iPhone e outros: biblioteca ZXing (carregada na 1.ª vez).
   Se o browser não deixar usar a câmara ao vivo, há a alternativa de tirar uma foto ao código. */
const CAM_FMT=['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code','data_matrix'];
const CAM_ZXING='https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/pure/+esm';
let CAM=null,CAM_DET=null;
/* por defeito o botão aparece em telemóveis/tablets com câmara; nos PDAs com leitor pode ser desligado nas Definições */
function camVisivel(){if(S.camara===true||S.camara===false)return S.camara;return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&matchMedia('(pointer:coarse)').matches;}
async function camDetetor(){
  if(CAM_DET)return CAM_DET;
  if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=CAM_FMT.filter(x=>sup.includes(x));if(f.length)return CAM_DET=new BarcodeDetector({formats:f});}catch(e){}}
  const m=await import(CAM_ZXING);return CAM_DET=new m.BarcodeDetector({formats:CAM_FMT});
}
function camHtml(msg){
  return `<div class="cam-top"><b>📷 ${view==='order'&&S.papel!=='sep'?'Ler artigos':S.modoSep==='pca'&&S.papel==='sep'?'Ler número do PCA':'Ler número do pedido'}</b><button type="button" id="camLuz" hidden>💡</button><button type="button" id="camFechar">Fechar</button></div>
    <div class="cam-vid"><video id="camVid" playsinline muted autoplay></video><div class="alvo" id="camAlvo"></div>${msg?`<div class="cam-msg">${msg}</div>`:''}</div>
    <div class="cam-fb" id="camFb"><div class="t">Aponte para o código de barras</div><div class="s">Mantenha o código dentro do retângulo verde. Lê sozinho, sem carregar em nada.</div></div>`;
}
/* a câmara ao vivo só funciona se a página onde o PalKo corre a autorizar; o Google pode bloqueá-la.
   Nesse caso o 📷 abre logo a câmara do telemóvel para tirar uma foto ao código (lida automaticamente). */
function camSoFoto(){
  if(S.camFoto===true)return true;
  try{const fp=document.permissionsPolicy||document.featurePolicy;if(fp&&fp.allowsFeature&&!fp.allowsFeature('camera'))return true;}catch(e){}
  return false;
}
function camFotoDireta(){
  let i=$('#camFileG');
  if(!i){i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.id='camFileG';i.hidden=true;document.body.appendChild(i);
    i.onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
      const msg=document.createElement('div');msg.id='camLendo';msg.className='toast';msg.textContent='A ler o código da foto…';document.body.appendChild(msg);
      try{const det=await camDetetor();let img;try{img=await createImageBitmap(f,{resizeWidth:1600,resizeQuality:'high'});}catch(e){img=await createImageBitmap(f);}
        const r=await det.detect(img);msg.remove();
        if(r&&r.length)handleScan(String(r[0].rawValue||'').trim());
        else{toast('Não encontrei nenhum código na foto. Tire outra mais perto e com o código direito.');beep('bad',S.som);}
      }catch(e){msg.remove();toast('Não foi possível ler a foto: '+(e&&e.message||e));}};}
  i.click();
}
async function abrirCamara(){
  if(CAM)return;
  const L=document.createElement('div');L.id='camLayer';L.innerHTML=camHtml('A ligar a câmara…');document.body.appendChild(L);
  CAM={L,last:{c:'',t:0},vivo:true};
  $('#camFechar').onclick=fecharCamara;
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!CAM){st.getTracks().forEach(t=>t.stop());return;}
    CAM.st=st;L.querySelector('.cam-msg')?.remove();
    const v=$('#camVid');v.srcObject=st;await v.play().catch(()=>{});
    const tr=st.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    if(cap.torch){const b=$('#camLuz');b.hidden=false;let on=false;b.onclick=()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});b.textContent=on?'🔦':'💡';};}
    const det=await camDetetor();
    const ciclo=async()=>{if(!CAM||!CAM.vivo)return;
      try{if(v.readyState>=2){const r=await det.detect(v);if(r&&r.length)camLeu(r[0].rawValue);}}catch(e){}
      CAM&&(CAM.tm=setTimeout(ciclo,140));};
    ciclo();
  }catch(e){S.camFoto=true;save();camFoto(e);}
}
/* alternativa sem câmara ao vivo: tirar uma foto ao código */
function camFoto(e){
  if(!CAM)return;const L=CAM.L;
  const permissao=e&&/NotAllowed|Permission|denied/i.test(String(e.name||e.message||e));
  L.querySelector('.cam-vid').innerHTML=`<div class="stack" style="gap:12px;padding:20px;text-align:center;max-width:340px">
    <div style="font-size:15px">${permissao?'O telemóvel não deu autorização para usar a câmara ao vivo.':'A câmara ao vivo não está disponível neste browser.'}</div>
    <label class="btn primary" style="min-height:56px;font-size:17px">📸 Tirar foto ao código<input type="file" accept="image/*" capture="environment" id="camFile" hidden></label>
    <div class="small" style="color:#C9D8BE">${permissao?'Para ler ao vivo, autorize a câmara nas definições do browser para este site.':''}</div></div>`;
  $('#camFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;$('#camFb').innerHTML='<div class="t">A ler a foto…</div>';
    try{const det=await camDetetor();const img=await createImageBitmap(f);const r=await det.detect(img);
      if(r&&r.length)camLeu(r[0].rawValue,true);else{$('#camFb').className='cam-fb bad';$('#camFb').innerHTML='<div class="t">Não encontrei nenhum código na foto</div><div class="s">Tire outra mais perto, com o código direito e bem iluminado.</div>';}
    }catch(err){$('#camFb').className='cam-fb bad';$('#camFb').innerHTML='<div class="t">Não foi possível ler a foto</div><div class="s">'+esc(String(err&&err.message||err))+'</div>';}
    ev.target.value='';};
}
function camLeu(raw,foto){
  const c=String(raw||'').trim();if(!c||!CAM)return;const now=Date.now();
  if(c===CAM.last.c&&now-CAM.last.t<1600)return;   // o mesmo código seguido: espera um pouco (afaste e volte a apontar para contar outro)
  CAM.last={c,t:now};
  const a=$('#camAlvo');if(a){a.classList.add('hit');setTimeout(()=>a.classList.remove('hit'),350);}
  const emPedido=view==='order'&&S.papel!=='sep'&&cur&&!finishing;
  handleScan(c);
  if(!emPedido){fecharCamara();return;}               // na lista: abre o pedido/PCA e fecha a câmara
  setTimeout(()=>{const fb=$('#camFb');if(!fb||!CAM)return;const L=lastFb||{k:'ok',t:'Lido: '+c,s:''};
    const o=orderByPed(cur),T=o?totals(o):null,feito=T&&T.need>0&&T.falta===0&&T.exc===0&&T.ext===0;
    fb.className='cam-fb '+(L.k||'');fb.innerHTML=`<div class="t">${esc(L.t)}${T?` <span class="mono" style="float:right">${fmtN(T.got)}/${fmtN(T.need)}</span>`:''}</div><div class="s">${esc(L.s||'')} · <span class="mono">${esc(c)}</span></div>`;
    if(view!=='order'||finishing)fecharCamara();
    else if(feito){fb.innerHTML+='<div class="t" style="color:var(--ok);margin-top:4px">✓ Tudo lido — a câmara fecha para terminar a conferência</div>';setTimeout(fecharCamara,1600);}},60);
}
function fecharCamara(){
  if(!CAM)return;CAM.vivo=false;clearTimeout(CAM.tm);
  try{CAM.st&&CAM.st.getTracks().forEach(t=>t.stop());}catch(e){}
  CAM.L.remove();CAM=null;
}

function handleScan(raw){
  const code=String(raw||'').trim();if(!code)return;
  if(view!=='order'){
    const o=DATA.encomendas.find(o=>pedKey(o.pedido)===pedKey(code)||norm(o.pedido)===norm(code));
    if(o&&!(S.papel==='sep'&&S.modoSep==='pca')){S.papel==='sep'?openSep(o.pedido):openOrder(o.pedido);return;}
    if(S.papel==='sep'){const pc=pcaPorCodigo(code);if(pc){openPCA(pc.pca);return;}if(o){openSep(o.pedido);return;}}
    if(S.papel==='sep'){toast(S.modoSep==='pca'?'Leia ou escreva o número de um PCA.':'Leia ou escreva o número de um pedido.');beep('warn',S.som);return;}
    toast('Abra uma encomenda antes de ler artigos.');beep('warn',S.som);return;
  }
  if(S.papel==='sep'){if(view==='pca'){const pc=pcaPorCodigo(code);if(pc&&pc.pca!==curPCA&&!S.pcaAtivas[curPCA]){openPCA(pc.pca);return;}}toast('Na separação não é preciso ler artigos.');return;}
  const o=orderByPed(cur);if(!o||conflito||RECESC)return;
  if(finishing&&FIN&&FIN.add&&FIN.add.tipo){const r=matchIdx(o,code);
    if(r.idx>=0&&!r.off){const n=$('#nota');if(n)FIN.nota=n.value;addIncidencia(ik(o,r.idx));beep('ok',S.som);toast(`Incidência registada: ${o.items[r.idx].desc}`);render();}
    else{beep('bad',S.som);toast('Esse código não pertence a esta encomenda.');}
    return;}
  if(finishing)return;
  if(o.sepEstado!=='Separado'&&!prog(o.pedido)&&!motivoSemConferencia(o)){lastFb={k:'warn',t:'Ainda não foi separado',s:'Só se confere depois de a separação estar terminada.'};beep('warn',S.som);render();return;}
  if(o.faturado){lastFb={k:'warn',t:'Pedido já faturado',s:'Este pedido já foi fechado pelo escritório e não pode ser conferido de novo.'};beep('warn',S.som);render();return;}
  if(motivoSemConferencia(o)){lastFb={k:'warn',t:motivoSemConferencia(o),s:'Este pedido não é para conferir. Confirme com o responsável.'};beep('warn',S.som);render();return;}
  if(S.pausa)retomar();
  ASSOC=null;finishing=false;startLocal(o.pedido);const p=prog(o.pedido);
  const r=matchIdx(o,code);let fb;
  if(r.idx>=0&&!r.off){
    const it=o.items[r.idx];const K=ik(o,r.idx);p.counts[K]=(p.counts[K]||0)+1;p.lidas=p.lidas||{};p.lidas[K]=(p.lidas[K]||0)+1;const c=p.counts[K],a=alvo(it);
    if(c>a){fb={k:'bad',t:'Quantidade a mais',s:`${it.desc} · ${fmtN(c)} de ${fmtN(a)}`};beep('bad',S.som);}
    else if(c===a){fb={k:'ok',t:'Artigo completo',s:`${it.desc} · ${fmtN(c)} de ${fmtN(a)}`};beep('ok',S.som);}
    else{fb={k:'ok',t:'Artigo certo',s:`${it.desc} · ${fmtN(c)} de ${fmtN(a)} — faltam ${fmtN(a-c)}`};beep('ok',S.som);}
    lastHit=r.idx;p.log.push({t:now(),code,res:c>a?'excesso':'ok'});
  }else if(r.off){
    const it=o.items[r.idx];fb={k:'warn',t:`Artigo com estado «${it.estado}»`,s:`${it.desc} — está fora da conferência. Confirme com o responsável.`};beep('warn',S.som);lastHit=r.idx;
  }else{
    const outro=otherOrderWith(code,o.pedido);
    const porConferir=o.items.some((it,i)=>incluido(it)&&cnt(o,i)<alvo(it));
    if(!outro&&porConferir&&/^\d{8,14}$/.test(String(code).replace(/\s/g,''))){
      /* código que não está em nenhuma encomenda nem na tabela: o conferente pode dizer a que artigo pertence */

function lojasDe(lista){const c={};lista.forEach(o=>{const l=o.loja||'—';c[l]=(c[l]||0)+1;});return Object.keys(c).sort().map(l=>[l,c[l]]);}
/* ---------- o meu dia / o meu turno (KPI do próprio operador) ---------- */

/* ---------- Incidências (antes da faturação) e HandOver (depois da faturação) ---------- */
let FZ={todos:false,sel:new Set(),rep:new Set(),sair:false,vistos:null};
const fechado=o=>o.estado==='Conferida'||o.estado==='Pendente';
const meu=o=>o.conferente===S.operador;
/* incidências por reportar: do próprio conferente (ou de todos, se pedir) */
function incPorReportar(todos){
  return DATA.encomendas.filter(o=>o.incPrecisa&&!o.incReportada&&(todos||meu(o)))
    .sort((a,b)=>String(a.conferidoEm||'').localeCompare(String(b.conferidoEm||'')));
}
/* HandOver: pedidos já faturados, de qualquer conferente */
/* o HandOver é feito pela equipa de faturação no Backoffice: não aparece no PDA */
function handProntos(){return [];}
function aguardamFat(){
  return DATA.encomendas.filter(o=>fechado(o)&&!o.faturado&&o.handover!=='Feito'&&meu(o)&&!(o.incPrecisa&&!o.incReportada))
    .sort((a,b)=>String(a.conferidoEm||'').localeCompare(String(b.conferidoEm||'')));
}
function porFinalizar(){return incPorReportar(false).concat(handProntos());}
/* avisa (som + vibração) quando o Backoffice fatura pedidos novos */
function avisarFaturados(){
  if(!S.operador||S.papel==='sep'){FZ.vistos=null;return;}
  const H=handProntos().map(o=>o.pedido);
  if(FZ.vistos){const novos=H.filter(p=>!FZ.vistos.has(p));if(novos.length){beep('warn',S.som);toast(novos.length===1?`Pedido ${novos[0]} faturado: pronto para HandOver`:`${novos.length} pedidos faturados: prontos para HandOver`);}}
  FZ.vistos=new Set(H);
}
function vHand(){
  if(S.papel==='sep')return '';
  const I=incPorReportar(false),Hd=handProntos();if(!I.length&&!Hd.length)return '';
  const H=DATA.handover||{max:5,min:30};
  const velho=Hd.reduce((m,o)=>{const t=Date.parse(o.faturadoEm||'');return isNaN(t)?m:Math.min(m,t);},Date.now());
  const mins=Math.round((Date.now()-velho)/60000),warnH=Hd.length&&(Hd.length>=H.max||mins>=H.min),warn=I.length||warnH;
  const partes=[I.length?`<b>${I.length}</b> incidência${I.length===1?'':'s'} por reportar`:'',Hd.length?`<b>${Hd.length}</b> pedido${Hd.length===1?'':'s'} pronto${Hd.length===1?'':'s'} para HandOver`:''].filter(Boolean).join(' · ');
  const sub=I.length?'Reporte já no ficheiro: o escritório não pode faturar sem isso.':warnH?(Hd.length>=H.max?`Já há ${Hd.length} pedidos faturados`:`Faturado há ${mins} min`)+': faça o HandOver':'';
  return `<button class="hand ${warn?'warn':''}" id="handBtn">${I.length?'📝':'🖥'}<span>${partes}${sub?`<br><small>${sub}</small>`:''}</span><span class="go">Ver ›</span></button>`;
}
async function copiar(txt){
  try{await navigator.clipboard.writeText(txt);toast('Texto copiado. Cole no ficheiro de incidências.');return;}catch(e){}
  const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
  try{document.execCommand('copy');toast('Texto copiado. Cole no ficheiro de incidências.');}catch(e){toast('Não foi possível copiar: selecione o texto e copie à mão.');}t.remove();
}
function vFinalizar(){
  const I=incPorReportar(FZ.todos),Hd=handProntos(),Ag=aguardamFat();

async function openSep(ped,forcar){

async function closeSep(){

  on('#retomarBtn',()=>retomar());
  document.querySelectorAll('[data-pausa]').forEach(b=>b.onclick=()=>pausar(b.dataset.pausa));
  document.querySelectorAll('[data-asel]').forEach(b=>b.onclick=()=>{ASSOC.sel=+b.dataset.asel;render();});
  on('#assocOk',associarConfirmar);
  on('#assocNao',associarRecusar);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render();});
  document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{filtroData=b.dataset.fd;render();});
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>setCount(+b.dataset.inc,1));
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>setCount(+b.dataset.dec,-1));
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const o=orderByPed(cur),i=+b.dataset.all;setCount(i,alvo(o.items[i])-cnt(o,i),true);});
  document.querySelectorAll('[data-rmx]').forEach(b=>b.onclick=()=>removeExtra(b.dataset.rmx));
  const lf=$('#loginForm');if(lf)lf.onsubmit=e=>{e.preventDefault();const n=$('#nomeIn').value.trim().replace(/\s+/g,' '),l=$('#ldapIn').value.trim().replace(/\s+/g,'').toUpperCase();
    const pp=document.querySelector('input[name=papel]:checked');if(!pp){$('#loginMsg').textContent='Escolha Separação ou Conferência.';return;}
    if(n.length<3){$('#loginMsg').textContent='Escreva o nome completo.';return;}
    if(!/^[A-Z0-9._-]{3,20}$/.test(l)){$('#loginMsg').textContent='O número LDAP deve ter entre 3 e 20 letras ou algarismos, sem espaços.';return;}
    S.recentes=[{nome:n,ldap:l},...S.recentes.filter(r=>r.ldap!==l)].slice(0,6);S.nome=n;S.ldap=l;S.papel=pp.value;S.entrada=now();S.operador=quem();S.pausa=null;filtro=S.papel==='sep'?'sep':'todo';sessao('entrada');save();render();refresh(true);};
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{const r=S.recentes[+b.dataset.rec];$('#nomeIn').value=r.nome;$('#ldapIn').value=r.ldap;document.querySelectorAll('.recente').forEach(x=>x.classList.toggle('on',x===b));});
  const nIn=$('#nomeIn');if(nIn&&!nIn.value)nIn.focus();else{const li=$('#ldapIn');if(li)li.focus();}
  const qIn=$('#qIn');if(qIn)qIn.oninput=()=>{pesquisa=qIn.value;const pos=qIn.selectionStart;render();const n=$('#qIn');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  const somIn=$('#somIn');if(somIn)somIn.onchange=()=>{S.som=somIn.checked;save();};
  const autoIn=$('#autoIn');if(autoIn)autoIn.onchange=()=>{S.autoLeitura=autoIn.checked;save();};
  const camIn=$('#camIn');if(camIn)camIn.onchange=()=>{S.camara=camIn.checked;save();render();};
  const cvi=$('#camVivoIn');if(cvi)cvi.onchange=()=>{S.camFoto=false;save();render();toast('Na próxima leitura experimenta de novo a câmara ao vivo.');};
  document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{if(camSoFoto())camFotoDireta();else abrirCamara();});
  on('#okAvisos',()=>{S.avisos=[];save();render();});
  on('#limparSaidas',()=>{Object.keys(S.progress).filter(p=>!orderByPed(p)).forEach(p=>delete S.progress[p]);save();render();});
  on('#trocarBtn',()=>{
    const pfI=S.papel==='sep'?[]:incPorReportar(false),pf=S.papel==='sep'?[]:pfI.concat(handProntos().filter(meu));
    if(pf.length&&!FZ.sair){$('#sairAsk').innerHTML=`<div class="feedback warn" style="margin-top:8px"><div class="stack" style="gap:6px"><div class="fb-title">${pfI.length?`Tem ${pfI.length} incidência${pfI.length===1?'':'s'} por reportar`:`Há ${pf.length} pedido${pf.length===1?'':'s'} faturado${pf.length===1?'':'s'} por fazer HandOver`}</div><div class="fb-sub">${pfI.length?'Reporte-as no ficheiro antes de sair: sem isso o escritório não pode faturar.':'Faça o HandOver antes de sair, ou deixe para um colega.'}</div><div class="row"><button class="btn sm primary" id="sairVer">Ver a lista</button><button class="btn sm" id="sairMesmo">Sair mesmo assim</button></div></div></div>`;
      $('#sairVer').onclick=()=>setView('finalizar');$('#sairMesmo').onclick=()=>{FZ.sair=true;$('#trocarBtn').click();};return;}
    FZ.sair=false;if(S.pausa){S.pausa=null;sessao('retoma');}sessao('saida');enviarPendentes();S.operador='';S.ldap='';S.entrada=null;S.papel='';view='list';save();render();});
  on('#handBtn',()=>{FZ.sel=new Set();FZ.rep=new Set();setView('finalizar');});
  const fzT=$('#fzTodos');if(fzT)fzT.onchange=()=>{FZ.todos=fzT.checked;render();};
  document.querySelectorAll('[data-fzsel]').forEach(c=>c.onchange=()=>{c.checked?FZ.sel.add(c.dataset.fzsel):FZ.sel.delete(c.dataset.fzsel);render();});
  document.querySelectorAll('[data-fzrep]').forEach(c=>c.onchange=()=>{const p=c.dataset.fzrep;c.checked?FZ.rep.add(p):FZ.rep.delete(p);render();});
  document.querySelectorAll('[data-fzcopy]').forEach(b=>b.onclick=()=>{const o=orderByPed(b.dataset.fzcopy);if(o)copiar(o.resumoInc||o.pendente||'');});
  on('#fzCopiarTodas',()=>copiar(incPorReportar(FZ.todos).map(o=>o.resumoInc||o.pendente).join('\n')));
  on('#fzSelTodos',()=>{handProntos().forEach(o=>FZ.sel.add(o.pedido));render();});
  on('#fzRepOk',async()=>{const ped=[...FZ.rep];if(!ped.length)return;const b=$('#fzRepOk');b.disabled=true;b.textContent='A guardar…';
    try{await enviarPendentes();const r=await api('foReportar',ped,S.operador);
      r.feitos.forEach(p=>{const o=orderByPed(p);if(o)o.incReportada=true;FZ.rep.delete(p);});
      toast(r.feitos.length===1?'Incidência registada como reportada':`${r.feitos.length} incidências registadas como reportadas`);render();refresh(true);}catch(e){toast('Sem ligação: tente de novo daqui a pouco.');render();}});
  on('#fzOk',async()=>{const ped=[...FZ.sel];if(!ped.length)return;
    const b=$('#fzOk');b.disabled=true;b.textContent='A guardar…';
    try{await enviarPendentes();const r=await api('foFinalizar',ped,S.operador);
      r.feitos.forEach(p=>{const o=orderByPed(p);if(o)o.handover='Feito';FZ.sel.delete(p);});
      toast(r.feitos.length===1?'HandOver registado':`HandOver registado em ${r.feitos.length} pedidos`);if(r.falta&&r.falta.length)toast('Já tratado ou ainda não faturado: '+r.falta.join(', '));
      render();refresh(true);}catch(e){toast('Sem ligação: tente de novo daqui a pouco.');render();}});
  const sf=$('#scanForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const i=$('#scanIn');const v=i.value;i.value='';handleScan(v);setTimeout(()=>$('#scanIn')?.focus(),0);};
  /* leitura automática: o leitor escreve o código todo em poucos milésimos; ao parar, conta sozinho (sem Enter).
     Quem escreve à mão é mais lento: aí continua a ser preciso carregar em Enter. */
  const si=$('#scanIn');if(si){let prev=0,last=0,rapido=true,tm=null;
    si.oninput=()=>{const t=Date.now(),v=si.value,add=v.length-prev;prev=v.length;
      if(v.length<=Math.max(add,1))rapido=true;else if(add>=3)rapido=true;else if(add===1&&t-last>70)rapido=false;
      last=t;clearTimeout(tm);
      if(S.autoLeitura!==false&&rapido&&v.trim().length>=4)tm=setTimeout(()=>{const n=$('#scanIn');if(n&&n.value===v){n.value='';prev=0;handleScan(v);setTimeout(()=>$('#scanIn')?.focus(),0);}},160);};}
  on('#kbBtn',()=>{S.teclado=!S.teclado;save();render();$('#scanIn').focus();});
  on('#backBtn',()=>{setView('list');refresh(true);});
  on('#cfBack',()=>{setView('list');});
  on('#cfForce',()=>openOrder(cur,true));
  on('#recTudo',()=>openOrder(cur,false,true));
  on('#recDif',async()=>{const b=$('#recDif'),ped=cur;b.disabled=true;b.textContent='A preparar…';
    try{const alt=await api('foRecontar',ped,S.operador);const o=orderByPed(ped);if(o){o.alteracao=alt;o.estado='Por reconferir';}
      toast(`Recontar ${alt.linhas.length} linha${alt.linhas.length===1?'':'s'}`);openOrder(ped,false,true);}
    catch(e){toast(e&&e.message&&!/fetch|ligação|network/i.test(e.message)?e.message:'Sem ligação: tente de novo daqui a pouco.');b.disabled=false;b.textContent='Recontar só o material com diferenças';}});
  on('#finBtn',()=>{startLocal(cur);finishing=true;FIN=null;lastFb=null;lastHit=null;ASSOC=null;render();toTop();});
  on('#finBack',()=>{finishing=false;FIN=null;render();});
  const guardaNota=()=>{const n=$('#nota');if(n&&FIN)FIN.nota=n.value;};
  const notaEl=$('#nota');if(notaEl)notaEl.oninput=guardaNota;
  on('#addInc',()=>{guardaNota();FIN.add={tipo:null};render();});
  on('#addCancel',()=>{guardaNota();FIN.add=null;render();});
  on('#addTroca',()=>{guardaNota();FIN.add.tipo=null;render();});
  document.querySelectorAll('[data-atipo]').forEach(b=>b.onclick=()=>{guardaNota();FIN.add.tipo=b.dataset.atipo;render();});
  document.querySelectorAll('[data-apick]').forEach(b=>b.onclick=()=>{guardaNota();addIncidencia(b.dataset.apick);render();});
  document.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{guardaNota();const m=FIN.man[+b.dataset.mq];if(m){m.qt=Math.max(1,m.qt+(+b.dataset.d));}render();});
  document.querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{guardaNota();FIN.man.splice(+b.dataset.mx,1);render();});
  document.querySelectorAll('[data-sinc]').forEach(b=>b.onclick=()=>{const t=b.dataset.sinc;SEPF.inc=SEPF.inc.includes(t)?SEPF.inc.filter(x=>x!==t):[...SEPF.inc,t];render();});
  if(SEPF){const sc=$('#sSscc');if(sc)sc.oninput=()=>{SEPF.sscc=sc.value;};}

  on('#finOk',closeOrder);
  on('#resetBtn',()=>{$('#resetAsk').innerHTML='<div class="row" style="margin-top:8px"><span class="small">Apagar as leituras desta encomenda?</span><button class="btn sm danger" id="resetYes">Apagar leituras</button><button class="btn sm" id="resetNo">Cancelar</button></div>';$('#resetYes').onclick=resetOrder;$('#resetNo').onclick=()=>$('#resetAsk').innerHTML='';});
  if(lastHit!=null&&view==='order'){const el=$('#it'+lastHit);if(el&&el.getBoundingClientRect().top>window.innerHeight)el.scrollIntoView({block:'center',behavior:'smooth'});}
}
$('#refreshBtn').onclick=()=>{toast('A atualizar…');refresh();};

/* arranque: mostra a última lista guardada e atualiza do servidor */
DATA=lsGet(KEY+'.cache',DATA)||DATA;if(DATA.estadosAConferir)ESTADOS=DATA.estadosAConferir;if(DATA.incidencias)INCID=DATA.incidencias;if(DATA.prioridades)PRIOS=DATA.prioridades;
render();refresh(true);
setInterval(()=>refresh(true),30000);
</script>
</body>
</html>
