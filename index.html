<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#102405">
<title>PalKo · Leitor</title>
<style>
:root{--ok:#188803;--bad:#B3261E;--warn:#B06000;--ink:#1E2819;--muted:#5B6855}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1208;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#102405}
.top .tt{flex:1;min-width:0}.top b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{color:#C9D8BE;font-size:12px}
.top button{min-height:42px;border:0;border-radius:10px;padding:0 12px;font-weight:700;font-size:15px;background:#fff;color:#102405}
.prog{font-family:ui-monospace,monospace;font-weight:800;font-size:18px;color:#78BE20;padding:0 4px}
.vid{position:relative;flex:1;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover}
.alvo{position:absolute;left:8%;right:8%;top:36%;height:26%;border:3px solid #78BE20;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);transition:background .15s}
.alvo.hit{background:rgba(120,190,32,.35);border-color:#fff}
.msg{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.75);border-radius:10px;padding:12px;font-size:15px;line-height:1.4}
.fb{background:#fff;color:var(--ink);padding:12px 14px;min-height:84px;border-top:8px solid #ccc}
.fb.ok{border-top-color:var(--ok)}.fb.bad{border-top-color:var(--bad)}.fb.warn{border-top-color:var(--warn)}
.fb .t{font-weight:800;font-size:17px}.fb .s{font-size:13px;color:var(--muted);margin-top:3px}
.fim{color:var(--ok);font-weight:800;margin-top:6px}
</style></head>
<body><div id="app">
  <div class="top"><div class="tt"><b id="titulo">PalKo · Leitor</b><small id="sub">A ligar ao PalKo…</small></div><span class="prog" id="prog"></span>
    <button id="luz" hidden>💡</button><button id="voltar">Voltar ao PalKo</button></div>
  <div class="vid"><video id="v" playsinline muted autoplay></video><div class="alvo" id="alvo"></div><div class="msg" id="msg">A ligar a câmara…</div></div>
  <div class="fb" id="fb"><div class="t">Aponte para o código de barras</div><div class="s">Mantenha o código dentro do retângulo verde. Lê sozinho, como no PDA.</div></div>
</div>
<script>
/* Leitor de códigos do PalKo: abre a câmara ao vivo (aqui é permitido, por estar fora do Google) e envia cada código
   ao separador do PalKo que o abriu. O PalKo trata a leitura e responde com o resultado, que aparece em baixo. */
const FMT=['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code','data_matrix'];
const $=s=>document.querySelector(s);
const op=window.opener;
let det=null,last={c:'',t:0,seen:0},seq=0,pend={},ctx=null,aCaminho=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let AC=null;function bip(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.frequency.value=k==='ok'?1200:k==='bad'?240:600;g.gain.value=.15;o.start();o.stop(AC.currentTime+(k==='bad'?.35:.12));}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(k==='bad'?[120,60,120]:k==='warn'?80:30);}catch(e){}}
function mostrar(r,c){
  const fb=$('#fb');fb.className='fb '+(r.k||'');
  fb.innerHTML=`<div class="t">${esc(r.t||'')}</div><div class="s">${esc(r.s||'')}${c?` · <span style="font-family:monospace">${esc(c)}</span>`:''}</div>${r.feito?'<div class="fim">✓ Tudo lido — a voltar ao PalKo para terminar</div>':''}`;
}
function contexto(r){
  if(!r)return;ctx=r;
  if(r.titulo)$('#titulo').textContent=r.titulo;
  $('#sub').textContent=r.modo==='artigos'?'A ler artigos'+(r.operador?' · '+r.operador:''):'Leia o código do pedido ou do PCA';
  $('#prog').textContent=r.need!=null?r.got+'/'+r.need:'';
}
window.addEventListener('message',ev=>{const d=ev.data||{};if(d.palko!=='resposta')return;
  const p=pend[d.id];delete pend[d.id];contexto(d);
  if(p){mostrar(d,p.c);bip(d.k||'ok');}else if(d.t)mostrar(d);
  if(d.feito)setTimeout(voltar,1600);
});
function enviar(tipo,c){
  if(!op||op.closed){mostrar({k:'bad',t:'O PalKo não está aberto',s:'Abra o leitor a partir do botão 📷 do PalKo.'});return;}
  const id=++seq;pend[id]={c,t:Date.now()};
  try{op.postMessage({palko:tipo,id,c},'*');}catch(e){}
  setTimeout(()=>{if(pend[id]){delete pend[id];mostrar({k:'warn',t:'O PalKo não respondeu',s:'Toque em «Voltar ao PalKo» e veja se a leitura ficou registada.'},c);bip('warn');}},4000);
}
function voltar(){try{op&&op.focus&&op.focus();}catch(e){}window.close();
  setTimeout(()=>mostrar({k:'warn',t:'Feche este separador para voltar ao PalKo',s:'O browser não deixou fechar sozinho.'}),400);}
$('#voltar').onclick=voltar;
async function detetor(){
  if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=FMT.filter(x=>sup.includes(x));if(f.length)return new BarcodeDetector({formats:f});}catch(e){}}
  const m=await import('https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/pure/+esm');return new m.BarcodeDetector({formats:FMT});
}
/* o mesmo código só conta outra vez depois de sair da câmara (afastar e voltar a apontar, ou passar ao artigo seguinte) */
function leu(raw){const c=String(raw||'').trim();if(!c)return;const now=Date.now();
  if(c===last.c&&now-last.seen<700){last.seen=now;return;}last={c,t:now,seen:now};
  const a=$('#alvo');a.classList.add('hit');setTimeout(()=>a.classList.remove('hit'),300);
  enviar('codigo',c);}
async function arrancar(){
  if(!op){$('#msg').innerHTML='Este leitor abre-se a partir do PalKo: toque no botão <b>📷</b> dentro do PalKo.';$('#sub').textContent='Sem ligação ao PalKo';return;}
  enviar('ola','');
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$('#v');v.srcObject=st;await v.play().catch(()=>{});$('#msg').remove();
    const tr=st.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    if(cap.torch){const b=$('#luz');b.hidden=false;let on=false;b.onclick=()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});b.textContent=on?'🔦':'💡';};}
    det=await detetor();
    const ciclo=async()=>{try{if(v.readyState>=2&&!document.hidden){const r=await det.detect(v);if(r&&r.length)leu(r[0].rawValue);}}catch(e){}setTimeout(ciclo,140);};
    ciclo();
  }catch(e){$('#msg').innerHTML='Não foi possível ligar a câmara ('+esc(e&&e.name||e)+'). Autorize a câmara para este site nas definições do browser e volte a abrir o leitor.';}
}
arrancar();
</script></body></html>
